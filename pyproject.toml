[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-eval-demo"
version = "0.1.0"
description = "OSS learning demo: thin LangGraph-style tool-calling agent + golden-task eval harness."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "vk-ai" }]
keywords = ["langgraph", "agents", "eval", "tool-calling", "pytest"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/vk-ai/langgraph-eval-demo"
Issues = "https://github.com/vk-ai/langgraph-eval-demo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_eval_demo"]

[tool.hatch.build.targets.wheel.sources]
"src/langgraph_eval_demo" = "langgraph_eval_demo"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
