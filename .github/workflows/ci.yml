name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest (golden eval + unit tests)
        run: pytest -q
      - name: Run golden eval CLI
        run: python evals/runner.py
      - name: pass^k consistency gate (deterministic agent, k=3)
        run: python evals/runner.py --repeat 3 --min-pass-hat-k 1.0
      - name: pass^k demo with seeded flaky tools (informational, not gated)
        run: python evals/runner.py --repeat 5 --flaky evals/flaky_tools.json
